packages:
  - apps/*
  - packages/*

# Dependencies allowed to run install scripts (pnpm blocks them by default).
allowBuilds:
  '@embedded-postgres/windows-x64': true
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/darwin-arm64': true
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  sharp: true
  '@napi-rs/canvas': true
  unrs-resolver: true
